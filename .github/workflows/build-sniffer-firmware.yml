name: Build Platypus Sniffer firmware

# Builds firmware/platypus-sniffer on GitHub's standard Ubuntu runner (no
# custom container), installing the Zephyr SDK toolchain fresh each run via
# `west sdk install`. Patches the UF2 the same way scripts/build_sniffer.sh
# does locally, then uploads the result so it can be downloaded and flashed
# without ever compiling Zephyr on a phone/Termux.
#
# We deliberately do NOT use a pinned third-party CI container image here:
# the heltec_t114_v2 board is very new (added to Zephyr's main branch only
# weeks before this workflow was written) and requires Zephyr's current
# Python 3.12 minimum, which didn't run cleanly against an older pinned
# container's glibc. ubuntu-latest ships a recent enough glibc for that, so
# we build directly on it instead.
on:
  push:
    branches: [naughty-platypus]
    paths:
      - "firmware/platypus-sniffer/**"
      - "tools/inspect_uf2.py"
      - "tools/patch_uf2_family.py"
      - ".github/workflows/build-sniffer-firmware.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Python 3.12 (Zephyr's current minimum requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build gperf ccache dfu-util device-tree-compiler \
            wget xz-utils file make gcc g++ libsdl2-dev libmagic1

      - name: Install west and CMake
        run: python3 -m pip install -U west cmake

      # NOTE: if `heltec_t114_v2` is NOT an upstream Zephyr board (i.e. your
      # local build only works because you have a custom boards/ folder in
      # your own Zephyr workspace that isn't committed anywhere in this
      # repo), this build will fail with "board not found". If that
      # happens: copy that custom board definition folder into this repo
      # (e.g. repo/boards/...) and commit it - this workflow picks up a
      # top-level boards/ folder automatically via BOARD_ROOT below.
      - name: Set up west workspace (plain upstream Zephyr checkout)
        run: west init zephyrproject

      - name: Fetch Zephyr + modules
        working-directory: zephyrproject
        run: |
          west update
          python3 -m pip install -r zephyr/scripts/requirements.txt
          west zephyr-export

      - name: Install Zephyr SDK (arm toolchain only, to keep this fast)
        working-directory: zephyrproject
        run: |
          # Passing --toolchains makes this run non-interactively; omitting
          # it would prompt for a selection, which hangs a CI job forever.
          west sdk install --toolchains arm-zephyr-eabi

      - name: Build firmware
        working-directory: zephyrproject
        run: |
          BOARD_ROOT_ARG=""
          if [ -d "$GITHUB_WORKSPACE/repo/boards" ]; then
            BOARD_ROOT_ARG="-DBOARD_ROOT=$GITHUB_WORKSPACE/repo"
          fi
          west build -b heltec_t114_v2/nrf52840/uf2 \
            -d build/platypus-sniffer \
            "$GITHUB_WORKSPACE/repo/firmware/platypus-sniffer" \
            --pristine \
            -- $BOARD_ROOT_ARG

      - name: Patch UF2 for HT-n5262
        working-directory: repo
        run: |
          mkdir -p releases
          python3 tools/inspect_uf2.py "$GITHUB_WORKSPACE/zephyrproject/build/platypus-sniffer/zephyr/zephyr.uf2" || true
          python3 tools/patch_uf2_family.py \
            "$GITHUB_WORKSPACE/zephyrproject/build/platypus-sniffer/zephyr/zephyr.uf2" \
            releases/platypus-sniffer-HT-n5262-offset1000.uf2 \
            0x239a0071
          python3 tools/inspect_uf2.py releases/platypus-sniffer-HT-n5262-offset1000.uf2

      - name: Upload built UF2
        uses: actions/upload-artifact@v4
        with:
          name: platypus-sniffer-uf2
          path: repo/releases/platypus-sniffer-HT-n5262-offset1000.uf2
          retention-days: 30
