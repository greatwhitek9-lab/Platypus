# Platypus Sniffer - bare-radio BLE promiscuous sniffer
#
# We deliberately do NOT enable Zephyr's Bluetooth host/controller stack.
# The nRF52840 RADIO peripheral is driven directly in BLE PHY mode so we can
# receive every over-the-air packet on a channel (advertising or data),
# instead of only what a conformant BLE controller would hand to a host.
CONFIG_BT=n

# --- Core kernel ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# --- Direct hardware access ---
CONFIG_NRFX_RADIO=y
CONFIG_NRFX_TIMER1=y
CONFIG_NRFX_TIMER2=y
CONFIG_NRFX_PPI=y
CONFIG_NRFX_CLOCK=y

# --- USB device stack: CDC-ACM virtual serial port ---
# The sniffer shows up as a normal USB-serial device so no special host
# driver is required; platypus_sniff.py / the Wireshark extcap talk to it
# the same way you'd talk to a USB-serial GPS or modem.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Platypus BLE Sniffer"
CONFIG_USB_DEVICE_MANUFACTURER="greatwhitek9-lab"
CONFIG_USB_DEVICE_PID=0x0002
CONFIG_USB_DEVICE_VID=0x239A
# Bus-powered, conservative current draw so phones/tablets doing USB-host
# (OTG) power budgeting - Galaxy S26 Ultra and other Android devices
# included - don't flag or throttle the port. The radio + MCU comfortably
# run under 100mA; raise this only if you add power-hungry peripherals.
CONFIG_USB_SELF_POWERED=n
CONFIG_USB_MAX_POWER=96
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- Logging (kept off UART since UART is the capture transport) ---
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_UART=n

# --- Same flash layout fix Platypus already needed on this board ---
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0x1000
CONFIG_FLASH_LOAD_SIZE=0xdf000
