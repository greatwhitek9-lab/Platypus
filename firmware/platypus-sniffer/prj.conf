# Platypus Sniffer - bare-radio BLE promiscuous sniffer
#
# We deliberately do NOT enable Zephyr's Bluetooth host/controller stack.
# The nRF52840 RADIO peripheral is driven directly in BLE PHY mode so we can
# receive every over-the-air packet on a channel (advertising or data),
# instead of only what a conformant BLE controller would hand to a host.
CONFIG_BT=n

# --- Core kernel ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# --- Direct hardware access ---
# NOTE: our code (src/radio_ble.c) talks to the RADIO and TIMER1
# peripherals through the raw register-level HAL (hal/nrf_radio.h,
# hal/nrf_timer.h) rather than through nrfx's higher-level driver layer, so
# it does not need - and current Zephyr no longer even defines -
# CONFIG_NRFX_RADIO, CONFIG_NRFX_TIMER1/TIMER2 (now a single CONFIG_NRFX_TIMER
# driver-wide option), or CONFIG_NRFX_PPI (replaced by CONFIG_NRFX_GPPI).
# Those raw HAL headers are always available, no Kconfig gate required.
CONFIG_NRFX_CLOCK=y

# --- USB: the newer "USB device stack next" (USBD), not the legacy stack ---
# This board's devicetree has one CDC-ACM node, and both the legacy stack's
# class driver and this newer stack's class driver bind to it by default -
# enabling both at once fails the link with "multiple definition of
# ...dts_ord...". src/usb_transport.c is written against the USBD_* API
# (see Zephyr's samples/subsys/usb/cdc_acm for the reference pattern this
# follows), so the legacy stack stays off.
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# --- Logging (kept off UART since UART is the capture transport) ---
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_UART=n

# --- Same flash layout fix Platypus already needed on this board ---
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0x1000
CONFIG_FLASH_LOAD_SIZE=0xdf000
